name: cs5446-project
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip>=24
  - pip:
      # Official CUDA wheels for Linux/Windows x86_64. The wheel supplies
      # CUDA runtime libraries; a compatible NVIDIA driver is still required.
      # No local CUDA Toolkit, GPU model, or absolute environment prefix is used.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - "torch==2.8.0+cu128; platform_system == 'Linux' or platform_system == 'Windows'"
      # macOS has no CUDA support; keep the same PyTorch release for teammates.
      - "torch==2.8.0; platform_system == 'Darwin'"
      - torchrl==0.9.2
      - tensordict==0.9.1

      # Railway simulation and a lightweight environment for PPO smoke runs.
      - flatland-rl==4.3.0
      # Flatland's official flattened observation builders import RLlib.
      - ray[rllib]==2.58.0
      - gymnasium>=1.2,<2
      # Flatland requires NumPy < 2; avoid accidental incompatible upgrades.
      - numpy==1.26.4
      - scipy>=1.13,<1.16
      - pandas>=2.2,<3
      - networkx>=3.2,<3.5

      # Experiment configuration, logging, and progress reporting.
      - hydra-core>=1.3,<1.4
      - pyyaml>=6,<7
      - tensorboard>=2.18,<3
      - tqdm>=4.66,<5

      # Result plots, railway rendering, and GIF/MP4 export.
      - matplotlib>=3.9,<3.11
      - seaborn>=0.13,<0.14
      - pillow>=10,<13
      - imageio>=2.35,<3
      - imageio-ffmpeg>=0.5,<0.7

      # Interactive analysis and interface/integration checks.
      - jupyterlab>=4.2,<5
      - ipykernel>=6.29,<7
      - pytest>=8,<9
