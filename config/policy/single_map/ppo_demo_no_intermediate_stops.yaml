# Map config
random_map: false
map_seed: 42
width: 25
height: 25
max_num_cities: 2
grid_mode: true
max_rails_between_cities: 1
max_rail_pairs_in_city: 2
max_episode_steps: null # null uses the default limit generated by Flatland.

# Train config
number_of_agents: 2
speed_ratio_map:
  1.0: 1.0

# Intermediate stops config
intermediate_stops:
  enabled: false
  line_length: 2 # Includes origin and destination; use >= 3 when enabled.

# Observation config
observation:
  type: flattened_normalized_tree # Options: tree, flattened_normalized_tree, global.
  max_depth: 2
  observation_radius: 2
  predictor: null # null disables the optional shortest-path predictor.

# Reward config
reward:
  type: default

# Actor config
actor:
  type: shared
  model:
    name: mlp_policy_demo
    input_dim: 252
    hidden_dims: [64, 64]

# Critic config
critic:
  type: shared
  model:
    name: mlp_critic_demo
    input_dim: 252
    hidden_dims: [64, 64]

# Trainer config
trainer:
  type: ppo_demo
  training_seed: 42
  device: cuda # Options: cpu, cuda, cuda:0.

# Sample config
rollout_steps: 256
update_epochs: 4
batch_size: 128

# Advantage config
gamma: 0.99
gae_lambda: 0.0
normalize_advantage: true

# Optimizer config
total_epochs: 5000 # Each epoch collects one rollout and performs its PPO updates.
lr_schedule: constant # Options: constant, linear, cosine_with_warmup (10% warmup).
actor_lr: 0.0003
critic_lr: 0.0003
clip_epsilon: 0.2
entropy_coef: 0.01
max_grad_norm: 0.5
target_kl: null # null disables the optional early stopping based on KL divergence.

# Log config
log_interval: 50