# Map config
random_map: false
map_seed: 42
width: 30
height: 30
max_num_cities: 6
grid_mode: true
max_rails_between_cities: 3
max_rail_pairs_in_city: 3
max_episode_steps: null # null uses the default limit generated by Flatland.

# Train config
number_of_agents: 8
speed_ratio_map:
  1.0: 1.0

# Intermediate stops config
intermediate_stops:
  enabled: false
  line_length: 2 # Includes origin and destination; use >= 3 when enabled.

# Observation config
observation:
  type: flattened_normalized_tree # Options: tree, flattened_normalized_tree, global.
  max_depth: 3
  observation_radius: 2
  predictor: null # null disables the optional shortest-path predictor.

# Reward config
reward:
  type: champion
  config:
    progress_coef: 0.01
    deadlock_penalty: -5.0
    finish_bonus: 10.0

# Actor config
actor:
  type: shared
  model:
    name: mlp_policy_demo
    input_dim: 1020
    hidden_dims: [64, 64]

# Critic config
critic:
  type: shared
  model:
    name: mlp_critic_demo
    input_dim: 1020
    hidden_dims: [64, 64]

# Trainer config
trainer:
  type: ppo_demo
  training_seed: 42
  device: cuda # Options: cpu, cuda, cuda:0.

# Sample config
rollout_steps: 1024
update_epochs: 4
batch_size: 512

# Advantage config
gamma: 0.99
gae_lambda: 0.0
normalize_advantage: true

# Optimizer config
total_epochs: 80 # Each epoch collects one rollout and performs its PPO updates.
lr_schedule: constant # Options: constant, linear, cosine.
actor_lr: 0.0003
critic_lr: 0.0003
clip_epsilon: 0.2
entropy_coef: 0.01
entropy_schedule: cosine # Options: constant, linear, cosine.
entropy_coef_final: 0.001
max_grad_norm: 0.5
target_kl: null # null disables the optional early stopping based on KL divergence.

# Log config
log_interval: 1
wandb:
  enabled: true
  interval: 10
  api_key: [YOUR_WANDB_API_KEY] # Replace with your actual Weights & Biases API key.
  project: [YOUR_WANDB_PROJECT_NAME] # Replace with your actual Weights & Biases project name.
  entity: [YOUR_WANDB_ENTITY_NAME] # Replace with your actual Weights & Biases entity name.
  name: ppo_demo_no_intermediate_stops

# Checkpoint config
save_dir: ./checkpoints/policy/single_map/ppo_demo_no_intermediate_stops
checkpoint_interval: 20

# Visualize config
visualize_dir: ./output/policy/single_map/ppo_demo_no_intermediate_stops