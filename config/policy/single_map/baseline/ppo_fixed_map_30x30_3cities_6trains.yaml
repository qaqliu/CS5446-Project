# Map config
random_map: false
map_seed: 110
width: 30
height: 30
max_num_cities: 3
grid_mode: false
max_rails_between_cities: 2
max_rail_pairs_in_city: 2
max_episode_steps: 200 # null uses the default limit generated by Flatland.

# Train config
number_of_agents: 6
speed_ratio_map:
  1.0: 1.0

# Intermediate stops config
intermediate_stops:
  enabled: false
  line_length: 2 # Includes origin and destination; use >= 3 when enabled.

# Observation config
observation:
  type: flattened_normalized_tree
  max_depth: 3
  observation_radius: 10
  predictor: null

# Reward config
reward:
  type: champion
  config:
    progress_coef: 0.01
    deadlock_penalty: -5.0
    finish_bonus: 10.0

# Actor config
actor:
  type: communication_shared
  mask_finished: true # Mask finished trains as attention keys.
  model:
    name: communication_mlp_policy
    input_dim: 1020
    hidden_dims: [256, 128]
    communication_dim: 32
    num_heads: 4
    head_hidden_dims: [128]

# Critic config
critic:
  type: shared
  model:
    name: mlp_critic_demo
    input_dim: 1020
    hidden_dims: [128, 128]

# Trainer config
trainer:
  type: ppo
  training_seed: 42
  device: cuda # Options: cpu, cuda, cuda:0.

# Sample config
update_epochs: 3
batch_size: 32 # Number of valid train-step samples per minibatch.

# Advantage and critic target config
gamma: 0.995
gae_lambda: 0.95
gae_horizon: null
normalize_advantage: false

# Optimizer config
total_epochs: 2000 # Each epoch collects one complete episode.
lr_schedule: constant
actor_lr: 0.00001
critic_lr: 0.00001
clip_epsilon: 0.2
value_loss_coef: 0.5
entropy_coef: 0.01
scheduling_entropy_coef: 0.02
direction_entropy_coef: 0.05
entropy_schedule: constant
entropy_coef_final: 0.02
max_grad_norm: null
target_kl: null

# Log config
log_interval: 1
wandb:
  enabled: true
  interval: 1
  api_key: [YOUR_WANDB_API_KEY] # Replace with your actual Weights & Biases API key.
  project: [YOUR_WANDB_PROJECT_NAME] # Replace with your actual Weights & Biases project name.
  entity: [YOUR_WANDB_ENTITY_NAME] # Replace with your actual Weights & Biases entity name.
  name: ppo_fixed_map_30x30_3cities_6trains_seed110_ppo_communication

# Checkpoint config
save_dir: ./checkpoints/policy/single_map/baseline/ppo_fixed_map_30x30_3cities_6trains_seed110_ppo_communication
checkpoint_interval: 100

# Visualize config
visualize_dir: ./output/policy/single_map/baseline/ppo_fixed_map_30x30_3cities_6trains_seed110_ppo_communication
